<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>味の評価 - Pourfolio</title>
  <meta name="theme-color" content="#5a371f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Pourfolio">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/base.css">
</head>
<body>
  <main class="with-bottom-bar">
    <p class="crumb"><a href="index.html">トップ</a></p>
    <div id="notFound" hidden>
      <h1>抽出の記録が見つかりません</h1>
      <p class="muted">削除された抽出です。トップに戻ってください。</p>
    </div>

    <!-- 味の評価（B1・B2） -->
    <form id="formView" hidden novalidate>
      <div class="card saved-card" id="savedCard" hidden>
        <p><strong>抽出を保存しました</strong></p>
        <p class="num-line" id="savedStock"></p>
      </div>

      <h1>味の評価</h1>
      <p class="muted" id="sub"></p>

      <div class="card">
        <h2>総合</h2>
        <div class="stars" id="stars" role="group" aria-label="総合の★"></div>
        <span class="field-error" data-for="stars"></span>
        <h2 class="tags-head">一言</h2>
        <div class="chips" id="tags"></div>
      </div>

      <div class="card">
        <div class="jar-head">
          <h2>ちょうど良さ</h2>
          <button class="btn secondary small" type="button" id="allJust">全部ちょうど</button>
        </div>
        <p class="hint">自分にとって弱すぎるか強すぎるかを押します。分からない項目は押さなくてよい。もう一度押すと消えます</p>
        <div id="jar"></div>
        <span class="field-error" data-for="jar"></span>
      </div>

      <div class="card">
        <label class="field">
          <span class="label">メモ</span>
          <textarea id="memo" rows="2"></textarea>
        </label>
      </div>

      <span class="field-error" data-for="empty"></span>
      <p><a href="index.html" id="later">あとで評価する</a></p>
      <p id="msg" role="status"></p>

      <div class="bottom-bar">
        <button class="btn block" type="submit" id="save">評価を保存する</button>
      </div>
    </form>

    <!-- 保存したあと -->
    <div id="doneView" hidden>
      <h1>評価を保存しました</h1>
      <div class="card">
        <p id="doneBrew" class="muted"></p>
        <p id="doneSummary"></p>
      </div>
      <!-- 次の1杯の直し方（ダイヤルイン提案、F1） -->
      <div class="card suggest-card" id="suggestCard" hidden>
        <h2>次の1杯</h2>
        <p class="muted" id="sCell"></p>
        <p class="suggest-action" id="sAction"></p>
        <p class="muted" id="sNext"></p>
        <div class="row">
          <a class="btn" id="sBrew">この提案で淹れる</a>
        </div>
        <h3 class="suggest-why">根拠</h3>
        <ol class="reasons" id="sReasons"></ol>
      </div>
      <p class="muted" id="noSuggest" hidden>ちょうど良さの「濃さ」「酸味」「苦味」「渋み」か、一言の「薄い」「濃い」「酸っぱい」「苦い」「渋い」を入れると、次の1杯の直し方が出ます。</p>
      <div class="row">
        <a class="btn" href="index.html" id="doneTop">トップへ</a>
        <button class="btn secondary" type="button" id="edit">評価を直す</button>
        <a class="btn secondary" id="doneBean" hidden>豆を見る</a>
      </div>
    </div>
  </main>
  <script type="module" src="js/tasting-page.js"></script>
</body>
</html>
