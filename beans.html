<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="color-scheme" content="light dark">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>豆と在庫 - Pourfolio</title>
  <meta name="theme-color" content="#5a371f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Pourfolio">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/base.css">
</head>
<body>
  <main class="with-bottom-bar">
    <p class="crumb"><a href="./">ホーム</a></p>
    <h1>豆と在庫</h1>
    <!-- 豆の一覧がすぐ見えるよう、ほかの機能は小さなリンクの並びにする（2-8の31番） -->
    <nav class="mini-links" aria-label="豆と在庫のほかの機能">
      <a href="order-import.html">注文メール</a>
      <a href="shopping.html">買い物リスト</a>
      <a href="wishlist.html">気になる豆</a>
      <a href="cost.html">コスト</a>
      <a href="shops.html">店の台帳</a>
      <a href="gift.html">おすそ分け</a>
      <a href="compare.html">実験</a>
    </nav>
    <p id="registeredMsg" class="ok" role="status" hidden></p>

    <div id="list" aria-live="polite"><p class="muted">読み込み中…</p></div>

    <label class="check-row">
      <input type="checkbox" id="showFinished">
      <span>飲み切りの豆も表示する <span class="muted" id="finishedCount"></span></span>
    </label>

    <div class="card">
      <h2>残り杯数の計算</h2>
      <p class="muted">1杯に使う粉の量です。残り杯数と「1杯淹れた」の初期値に使います。</p>
      <form id="doseForm" class="inline-form">
        <label class="field compact">
          <span class="label">1杯の粉の量</span>
          <span class="with-unit"><input type="text" inputmode="decimal" id="dose" autocomplete="off"><span>g</span></span>
        </label>
        <button class="btn secondary" type="submit">保存する</button>
      </form>
      <p id="doseMsg" role="status"></p>
    </div>

    <div class="bottom-bar">
      <a class="btn block" href="bean-edit.html">＋ 豆を登録する</a>
    </div>
  </main>
  <!-- tabbar：npm run sw が書き込む（手で直さない） -->
  <nav class="tabbar" aria-label="メニュー">
    <a class="tab" href="./"><svg viewBox="0 0 24 24" class="tab-icon" aria-hidden="true"><path d="M4 11 12 4l8 7v9h-5v-6H9v6H4z"></path></svg><span class="tab-label">ホーム</span></a>
    <a class="tab" href="recipes.html"><svg viewBox="0 0 24 24" class="tab-icon" aria-hidden="true"><path d="M5 6h14l-2 7a5 5 0 0 1-10 0zM9 20h6M12 18v2"></path></svg><span class="tab-label">淹れる</span></a>
    <a class="tab current" href="beans.html" aria-current="page"><svg viewBox="0 0 24 24" class="tab-icon" aria-hidden="true"><path d="M12 3c4 0 6 4 6 9s-2 9-6 9-6-4-6-9 2-9 6-9zM12 4c-2 4 2 8 0 16"></path></svg><span class="tab-label">豆と在庫</span></a>
    <a class="tab" href="analysis.html"><svg viewBox="0 0 24 24" class="tab-icon" aria-hidden="true"><path d="M4 20V4M4 20h16M8 16v-4M12 16V8M16 16v-6"></path></svg><span class="tab-label">分析</span></a>
    <a class="tab" href="more.html"><svg viewBox="0 0 24 24" class="tab-icon" aria-hidden="true"><path d="M5 12h.01M12 12h.01M19 12h.01"></path></svg><span class="tab-label">その他</span></a>
  </nav>
  <!-- /tabbar -->
  <script type="module" src="js/beans-page.js"></script>
  <script type="module" src="js/tabbar.js"></script>
</body>
</html>
