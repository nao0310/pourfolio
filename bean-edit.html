<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="color-scheme" content="light dark">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>豆の登録 - Pourfolio</title>
  <meta name="theme-color" content="#5a371f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Pourfolio">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/base.css">
</head>
<body>
  <main class="with-bottom-bar">
    <p class="crumb"><a href="beans.html" id="back">豆と在庫</a></p>
    <h1 id="title">豆の登録</h1>

    <!-- 商品ページの文章から入れる（X28） -->
    <details class="card paste-card" id="pasteBox">
      <summary>珈琲問屋の商品ページから入れる</summary>
      <p class="muted">Safariで商品ページを開き、文章を長押し →「すべてを選択」→「コピー」して、ここに貼り付けます。</p>
      <textarea id="pasteText" rows="5" aria-label="商品ページの文章"></textarea>
      <div class="row">
        <button class="btn secondary" type="button" id="pasteRead">読み取って入れる</button>
      </div>
      <p id="pasteMsg" role="status"></p>
    </details>

    <form id="form" novalidate>
      <input type="hidden" name="productCode">
      <div class="card">
        <label class="field">
          <span class="label">銘柄 <span class="req">必須</span></span>
          <input type="text" name="name" autocomplete="off" placeholder="例：エチオピア イルガチェフェ G1">
          <span class="field-error" data-for="name"></span>
        </label>

        <fieldset class="field">
          <legend class="label">焙煎度</legend>
          <div class="chips" id="roastChips"></div>
          <span class="field-error" data-for="roastLevel"></span>
        </fieldset>

        <label class="check-row">
          <input type="checkbox" name="decaf">
          <span>カフェインレス（デカフェ）</span>
        </label>

        <label class="field">
          <span class="label">焙煎日</span>
          <input type="date" name="roastDate">
          <span class="hint">袋に焙煎日がなければ、発送日を入れてください</span>
          <span class="field-error" data-for="roastDate"></span>
        </label>
      </div>

      <div class="card">
        <h2>重さ</h2>
        <fieldset class="field">
          <legend class="label">表記重量の基準</legend>
          <div class="chips two">
            <label class="chip"><input type="radio" name="labelWeightBasis" value="green" checked><span>生豆時</span></label>
            <label class="chip"><input type="radio" name="labelWeightBasis" value="roasted"><span>焙煎後</span></label>
          </div>
        </fieldset>
        <label class="field">
          <span class="label">表記重量</span>
          <span class="with-unit"><input type="text" inputmode="decimal" name="labelWeightG" autocomplete="off" placeholder="200"><span>g</span></span>
          <span class="field-error" data-for="labelWeightG"></span>
        </label>
        <label class="field">
          <span class="label">実重量（量ったとき）</span>
          <span class="with-unit"><input type="text" inputmode="decimal" name="actualWeightG" autocomplete="off" placeholder="袋から出して量った重さ"><span>g</span></span>
          <span class="field-error" data-for="actualWeightG"></span>
        </label>
        <p class="stock-preview" id="stockPreview" aria-live="polite"></p>
      </div>

      <div class="card">
        <label class="field">
          <span class="label">価格</span>
          <span class="with-unit"><input type="text" inputmode="numeric" name="priceJpy" autocomplete="off" placeholder="1200"><span>円</span></span>
          <span class="field-error" data-for="priceJpy"></span>
        </label>
        <label class="field">
          <span class="label">購入先</span>
          <input type="text" name="shop" autocomplete="off">
        </label>
      </div>

      <details class="card" id="more">
        <summary>産地・品種・日付などの詳細</summary>
        <label class="field">
          <span class="label">生産国</span>
          <input type="text" name="country" autocomplete="off" placeholder="例：エチオピア">
        </label>
        <label class="field">
          <span class="label">地域</span>
          <input type="text" name="region" autocomplete="off">
        </label>
        <label class="field">
          <span class="label">農園・生産者</span>
          <input type="text" name="farm" autocomplete="off">
        </label>
        <label class="field">
          <span class="label">品種</span>
          <select name="variety" id="variety"></select>
          <input type="text" name="varietyOther" autocomplete="off" placeholder="品種を入力" hidden>
        </label>
        <label class="field">
          <span class="label">精製</span>
          <select name="process" id="process"></select>
          <input type="text" name="processOther" autocomplete="off" placeholder="精製方法を入力" hidden>
        </label>
        <label class="field">
          <span class="label">注文日</span>
          <input type="date" name="orderDate">
          <span class="field-error" data-for="orderDate"></span>
        </label>
        <label class="field">
          <span class="label">到着日</span>
          <input type="date" name="arrivalDate">
          <span class="field-error" data-for="arrivalDate"></span>
        </label>
        <label class="field">
          <span class="label">商品ページのURL</span>
          <input type="url" name="productUrl" autocomplete="off" placeholder="https://">
          <span class="field-error" data-for="productUrl"></span>
        </label>
        <label class="field">
          <span class="label">店の風味説明</span>
          <textarea name="flavorNotes" rows="3"></textarea>
        </label>
        <label class="field">
          <span class="label">メモ</span>
          <textarea name="memo" rows="3"></textarea>
        </label>
        <fieldset class="field">
          <legend class="label">状態</legend>
          <div class="chips two">
            <label class="chip"><input type="radio" name="status" value="ordered"><span>入荷待ち</span></label>
            <label class="chip"><input type="radio" name="status" value="unopened" checked><span>未開封</span></label>
            <label class="chip"><input type="radio" name="status" value="open"><span>開封済み</span></label>
            <label class="chip"><input type="radio" name="status" value="finished"><span>飲み切り</span></label>
          </div>
        </fieldset>
      </details>

      <p id="msg" role="status"></p>

      <div class="bottom-bar">
        <button class="btn block" type="submit" id="save">登録する</button>
      </div>
    </form>
  </main>
  <script type="module" src="js/bean-edit-page.js"></script>
  <script type="module" src="js/tabbar.js"></script>
</body>
</html>
