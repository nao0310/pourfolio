<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="color-scheme" content="light dark">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>天気の地点 - Pourfolio</title>
  <meta name="theme-color" content="#5a371f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Pourfolio">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/base.css">
</head>
<body>
  <main>
    <p class="crumb"><a href="more.html">その他</a></p>
    <h1>天気の地点</h1>
    <p class="muted">地点を決めると、淹れた杯にその時刻の気温・湿度・天気が付き、暑い日にはアイスをすすめます。位置情報の許可は使いません。外に送るのは地点の緯度・経度だけです。</p>

    <form class="card" id="placeForm" novalidate>
      <h2>地点</h2>
      <label class="field">
        <span class="label">都道府県（県庁所在地の天気）</span>
        <select name="key" id="placeKey"></select>
        <span class="field-error" data-for="key"></span>
      </label>
      <div id="customBox" hidden>
        <label class="field">
          <span class="label">地点の名前（自分で分かるように）</span>
          <input type="text" name="name" autocomplete="off" maxlength="30" placeholder="家">
        </label>
        <label class="field">
          <span class="label">緯度（小数2桁まで使います）</span>
          <input type="text" name="lat" inputmode="decimal" autocomplete="off" placeholder="35.68">
          <span class="field-error" data-for="lat"></span>
        </label>
        <label class="field">
          <span class="label">経度</span>
          <input type="text" name="lon" inputmode="decimal" autocomplete="off" placeholder="139.76">
          <span class="field-error" data-for="lon"></span>
        </label>
      </div>
      <div class="row">
        <button class="btn" type="submit" id="placeSave">保存する</button>
      </div>
      <p id="placeMsg" role="status"></p>
    </form>

    <section class="card" id="hotCard">
      <h2>暑い日の線</h2>
      <p class="muted">今日の最高気温がこの温度以上の日は、ホームに「急冷アイスで淹れる」を出します。</p>
      <div id="hotField"></div>
      <div class="row">
        <button class="btn secondary" type="button" id="hotSave">線を保存する</button>
      </div>
      <p id="hotMsg" role="status"></p>
    </section>

    <section class="card" id="stateCard" aria-live="polite">
      <h2>いまの様子</h2>
      <div id="state"><p class="muted">読み込み中…</p></div>
      <div class="row">
        <button class="btn secondary" type="button" id="refresh" hidden>天気を取り直す</button>
      </div>
      <p id="stateMsg" role="status"></p>
    </section>

    <p class="muted small"><a href="https://open-meteo.com/" rel="noopener" target="_blank">Weather data by Open-Meteo.com</a>（無料・登録なし。1時間に1回まで問い合わせます）</p>
  </main>
