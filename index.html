<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Pourfolio</title>
  <meta name="description" content="個人用コーヒー記録・分析・提案アプリ">
  <meta name="theme-color" content="#5a371f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Pourfolio">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/base.css">
</head>
<body>
  <main>
    <img class="logo" src="icons/icon-192.png" alt="">
    <h1>Pourfolio 準備中</h1>
    <p>ハンドドリップ1杯ごとの記録・分析・提案アプリです。いまは公開テスト中です。</p>

    <div class="card">
      <p>レシピを選んで淹れます。4:6メソッドの雛形でレシピを作れます。</p>
      <div class="row">
        <a class="btn" href="recipes.html">淹れる</a>
        <a class="btn secondary" href="equipment.html">器具</a>
      </div>
    </div>

    <div class="card">
      <p>届いた豆を登録し、残量と飲み頃を確かめます。</p>
      <div class="row">
        <a class="btn" href="beans.html">豆と在庫</a>
      </div>
    </div>

    <div class="card">
      <p>ホーム画面に追加してから、保存テストで「アプリを閉じてもデータが残るか」を確かめてください。</p>
      <div class="row">
        <a class="btn" href="storage-test.html">保存テストを開く</a>
      </div>
    </div>

    <div class="card">
      <p>記録の書き出し（バックアップ）と復元はこちらです。</p>
      <div class="row">
        <a class="btn" href="data.html">データの書き出しと復元</a>
      </div>
    </div>

    <p class="muted" id="mode"></p>
  </main>
  <script type="module">
    import { isStandalone, registerServiceWorker } from './js/pwa.js';
    registerServiceWorker();
    document.getElementById('mode').textContent = isStandalone()
      ? 'ホーム画面のアプリとして開いています'
      : 'ブラウザで開いています（iPhoneでは「共有」→「ホーム画面に追加」で使ってください）';
  </script>
</body>
</html>
