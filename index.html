<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Pourfolio</title>
  <meta name="description" content="個人用コーヒー記録・分析・提案アプリ">
  <meta name="theme-color" content="#5a371f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Pourfolio">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/base.css">
</head>
<body>
  <main>
    <header class="home-head">
      <img class="logo-sm" src="icons/icon-192.png" alt="">
      <h1>Pourfolio</h1>
    </header>

    <!-- 保存の促し（G2） -->
    <div class="card backup-card" id="backupCard" hidden>
      <p><strong>記録を書き出しましょう</strong></p>
      <p class="muted" id="backupReason"></p>
      <div class="row">
        <a class="btn" href="data.html">書き出す</a>
      </div>
    </div>

    <div class="card resume-card" id="resumeCard" hidden>
      <p><strong>途中の抽出があります</strong></p>
      <div class="row">
        <a class="btn" href="brew.html" id="resumeLink">続きに戻る</a>
      </div>
    </div>

    <div class="card resume-card" id="unratedCard" hidden>
      <p><strong>まだ評価していない1杯</strong></p>
      <p class="muted" id="unratedText"></p>
      <div class="row">
        <a class="btn" id="unratedLink">評価する</a>
      </div>
    </div>

    <!-- 今日の1杯 -->
    <section class="card" id="todayCard">
      <h2>今日の1杯</h2>
      <p class="muted" id="todayText">読み込み中…</p>
      <p class="today-suggest" id="todaySuggest" hidden></p>
      <div class="stack" id="todayActions"></div>
    </section>

    <!-- 在庫アラート -->
    <section class="card alert-card" id="alertCard" hidden>
      <h2>在庫アラート</h2>
      <ul class="plain-list" id="alerts"></ul>
    </section>

    <!-- 豆ごとの飲み頃 -->
    <section class="card">
      <div class="sec-head">
        <h2>豆の飲み頃</h2>
        <a href="beans.html">豆と在庫</a>
      </div>
      <div id="beanBands"></div>
    </section>

    <!-- 直近の抽出 -->
    <section class="card">
      <h2>直近の抽出</h2>
      <ul class="plain-list" id="recent"></ul>
    </section>

    <nav class="home-menu" aria-label="メニュー">
      <a class="btn secondary" href="recipes.html">淹れる（レシピ）</a>
      <a class="btn secondary" href="beans.html">豆と在庫</a>
      <a class="btn secondary" href="equipment.html">器具</a>
      <a class="btn secondary" href="data.html">データ</a>
    </nav>

    <p class="muted" id="lastBackup"></p>
    <p class="muted" id="mode"></p>
  </main>
  <script type="module" src="js/index-page.js"></script>
</body>
</html>
