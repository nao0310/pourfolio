<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>保存テスト - Pourfolio</title>
  <meta name="theme-color" content="#5a371f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Pourfolio">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/base.css">
</head>
<body>
  <main>
    <p class="crumb"><a href="data.html">データ</a></p>
    <h1>保存テスト</h1>
    <p class="muted">端末内のデータベース（IndexedDB）に値を1件保存します。アプリを閉じて開き直しても残っていれば成功です。</p>

    <div class="card">
      <p class="muted">いま保存されている値</p>
      <p class="value" id="saved">読み込み中…</p>
      <p class="muted" id="savedAt"></p>
    </div>

    <div class="card">
      <label for="input">保存する値</label>
      <input type="text" id="input" autocomplete="off" placeholder="例：テスト1">
      <div class="row">
        <button class="btn" id="save" type="button">保存する</button>
        <button class="btn secondary" id="clear" type="button">消す</button>
      </div>
      <p id="msg" class="ok" role="status"></p>
    </div>

    <div class="card">
      <dl>
        <dt>開き方</dt><dd id="mode">—</dd>
        <dt>消されにくい保存</dt><dd id="persist">—</dd>
        <dt>使用量</dt><dd id="usage">—</dd>
      </dl>
    </div>

    <div class="row">
      <a class="btn secondary" href="./">トップに戻る</a>
    </div>
  </main>
  <script type="module" src="js/storage-test.js"></script>
</body>
</html>
