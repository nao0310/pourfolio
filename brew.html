<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>抽出 - Pourfolio</title>
  <meta name="theme-color" content="#5a371f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Pourfolio">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/base.css">
</head>
<body>
  <main class="with-bottom-bar">
    <p class="crumb"><a href="recipes.html" id="crumb">淹れる</a></p>
    <div id="notFound" hidden>
      <h1>レシピが見つかりません</h1>
      <p class="muted">削除されたレシピです。「淹れる」の一覧から選び直してください。</p>
    </div>

    <!-- 計画（スタート前） -->
    <div id="content" hidden>
      <div class="card resume-card" id="resumeCard" hidden>
        <p><strong>途中の抽出があります</strong></p>
        <p class="muted" id="resumeText"></p>
        <div class="row">
          <button class="btn" type="button" id="resume">続きに戻る</button>
        </div>
      </div>

      <h1 id="name"></h1>
      <p class="muted" id="sub"></p>

      <!-- ダイヤルイン提案（F1） -->
      <div class="card suggest-card" id="suggestCard" hidden>
        <p><strong id="sTitle">次の1杯の提案</strong></p>
        <p class="suggest-action" id="sText"></p>
        <p class="muted" id="sNote"></p>
        <div class="row" id="sRow" hidden>
          <a class="btn small" id="sUse">この提案を入れる</a>
        </div>
      </div>

      <div class="card">
        <label class="field">
          <span class="label">豆</span>
          <select id="bean"></select>
          <span class="hint" id="beanNote"></span>
        </label>
      </div>

      <div class="card">
        <h2>計画</h2>
        <div class="plan-grid" id="plan"></div>
        <dl id="equip"></dl>
      </div>

      <div class="card">
        <h2>注湯の予定</h2>
        <table class="pour-table">
          <thead><tr><th>投</th><th>時間</th><th>累計</th><th>注ぐ量</th></tr></thead>
          <tbody id="pourBody"></tbody>
        </table>
        <p class="muted" id="target"></p>
      </div>

      <!-- 抽出前チェック（A5）。チェックしなくてもスタートできる -->
      <div class="card">
        <h2>準備チェック</h2>
        <div class="precheck" id="precheck"></div>
        <p class="hint">済んだものを押します。押さなくてもスタートできます</p>
      </div>

      <p><a id="editLink">このレシピを編集する</a></p>
      <p><button class="link-btn" type="button" id="noTimer">タイマーを使わずに記録する</button></p>
      <p id="msg" role="status"></p>

      <div class="bottom-bar">
        <button class="btn block" type="button" id="start">スタート</button>
      </div>
    </div>

    <!-- 実績の確認（A4） -->
    <form id="resultView" hidden novalidate>
      <h1>実績の確認</h1>
      <p class="muted" id="resultSub"></p>

      <div class="card">
        <label class="field">
          <span class="label">豆</span>
          <select id="rBean"></select>
          <span class="hint">保存すると、この豆の残量が粉量の分だけ減ります</span>
        </label>
        <label class="check-row" id="rFrozenRow" hidden>
          <input type="checkbox" id="rFrozen">
          <span id="rFrozenText"></span>
        </label>
        <div class="field" id="rDoseBox"></div>
        <div class="field" id="rWaterBox"></div>
        <div class="field" id="rTempBox"></div>
        <label class="field">
          <span class="label">挽き目</span>
          <input type="text" id="rGrind" autocomplete="off">
        </label>
        <label class="field">
          <span class="label">総時間<span class="req">必須</span></span>
          <input type="text" id="rTotal" inputmode="numeric" autocomplete="off" placeholder="3:30">
          <span class="hint">落ち切るまでの時間。「3:30」のように入れます</span>
          <span class="field-error" data-for="totalSec"></span>
        </label>
        <div class="field" id="rBevBox"></div>
        <label class="field">
          <span class="label">メモ</span>
          <textarea id="rMemo" rows="2"></textarea>
        </label>
      </div>

      <div class="card">
        <h2>計画との差</h2>
        <ul class="diff-list" id="diff"></ul>
      </div>

      <div class="card" id="poursCard">
        <h2>注湯の実績</h2>
        <table class="pour-table">
          <thead><tr><th>投</th><th>予定</th><th>押した時刻</th><th>累計</th></tr></thead>
          <tbody id="rPourBody"></tbody>
        </table>
        <p class="muted">「—」は注湯完了を押さなかった投です</p>
      </div>

      <p><button class="link-btn" type="button" id="discard">記録せずにやめる</button></p>
      <p id="rMsg" role="status"></p>

      <div class="bottom-bar">
        <button class="btn block" type="submit">保存する</button>
      </div>
    </form>

  </main>

  <!-- ガイド付きタイマー（A2）。上半分に表示、下半分はどこを押しても注湯完了 -->
  <section class="timer-screen" id="timerView" hidden aria-label="抽出タイマー">
    <div class="timer-bar">
      <button class="timer-small" type="button" id="cancel">やめる</button>
      <button class="timer-small" type="button" id="speechToggle" aria-pressed="true">読み上げ オン</button>
    </div>
    <div class="timer-top">
      <p class="timer-elapsed num" id="tElapsed">0:00</p>
      <p class="timer-head"><span class="timer-phase" id="tPhase"></span><span class="timer-label" id="tLabel"></span></p>
      <p class="timer-target num" id="tTarget"></p>
      <p class="timer-add" id="tAdd"></p>
      <p class="timer-count num" id="tCount" aria-live="off"></p>
      <p class="timer-next muted" id="tNext"></p>
      <p class="timer-wake" id="tWake"></p>
    </div>
    <button class="timer-tap" type="button" id="tap">
      <span id="tapLabel">注湯完了</span>
      <span class="timer-tap-sub" id="tapSub">画面の下半分のどこを押してもよい</span>
    </button>
  </section>

  <script type="module" src="js/brew-page.js"></script>
</body>
</html>
