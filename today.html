<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>今日の一杯 - Pourfolio</title>
  <meta name="theme-color" content="#5a371f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Pourfolio">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/base.css">
</head>
<body>
  <main>
    <p class="crumb"><a href="./">ホーム</a></p>
    <h1>今日の一杯</h1>
    <p class="muted">手元の豆から、★の目安・飲み頃・残り・気分・カフェインで選んだ上位3つです。</p>

    <!-- 気分プリセット（F4） -->
    <section class="card">
      <h2>気分</h2>
      <div class="seg5" id="moodSeg" role="group" aria-label="気分"></div>
      <p class="hint" id="moodNote"></p>
    </section>

    <div id="picks" aria-live="polite"><p class="muted">読み込み中…</p></div>

    <!-- カフェイン（spec 6.4） -->
    <section class="card">
      <h2>カフェイン</h2>
      <p id="cafToday"></p>
      <label class="field">
        <span class="label">この時刻からカフェインを控える</span>
        <span class="row cutoff-row">
          <input type="time" id="cutoff">
          <button class="btn secondary small" type="button" id="cutoffClear">使わない</button>
        </span>
        <span class="hint">入れると、この時刻から朝5時まではカフェインレスの豆を上にし、ほかの豆は少なめ（0.7杯）にします</span>
      </label>
      <p id="msg" role="status"></p>
    </section>
  </main>
  <script type="module" src="js/today-page.js"></script>
  <script type="module" src="js/tabbar.js"></script>
</body>
</html>
