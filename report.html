<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>月次レポート - Pourfolio</title>
  <meta name="theme-color" content="#5a371f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Pourfolio">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/print.css">
  <style>@page { size: A4; margin: 14mm; }</style>
</head>
<body class="print-page">
  <main>
    <div class="no-print">
      <p class="crumb"><a data-analysis href="analysis.html">分析</a></p>
      <h1>月次レポート</h1>
      <section class="card">
        <label class="field">
          <span class="label">月</span>
          <select id="month"></select>
        </label>
        <p class="hint">「印刷する」でA4の1枚に。iPhoneは印刷の画面で2本指で広げると PDF になります（共有 →「ファイルに保存」）。PCでは送信先に「PDFに保存」を選びます。</p>
        <button class="btn block" type="button" id="printBtn">印刷する</button>
      </section>
    </div>

    <article class="report-sheet" id="sheet" aria-live="polite">
      <p class="muted">読み込み中…</p>
    </article>
  </main>
  <script type="module" src="js/report-page.js"></script>
  <script type="module" src="js/tabbar.js"></script>
</body>
</html>
