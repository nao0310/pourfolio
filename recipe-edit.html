<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>レシピを作る - Pourfolio</title>
  <meta name="theme-color" content="#5a371f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Pourfolio">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/base.css">
</head>
<body>
  <main class="with-bottom-bar">
    <p class="crumb"><a href="recipes.html">淹れる</a></p>
    <h1 id="title">レシピを作る</h1>

    <form id="form" novalidate>
      <div class="card">
        <label class="field">
          <span class="label">名前 <span class="req">必須</span></span>
          <input type="text" id="name" autocomplete="off" placeholder="例：朝の4:6">
          <span class="field-error" data-for="name"></span>
        </label>
        <fieldset class="field">
          <legend class="label">雛形</legend>
          <div class="chips three" id="templateChips"></div>
          <span class="hint" id="templateNote"></span>
        </fieldset>
        <fieldset class="field" id="tasteField">
          <legend class="label">味（前半40%の配分）</legend>
          <div class="chips three" id="tasteChips"></div>
        </fieldset>
        <fieldset class="field" id="strengthField">
          <legend class="label">濃さ（後半60%の回数）</legend>
          <div class="chips three" id="strengthChips"></div>
        </fieldset>
        <fieldset class="field" id="pourCountField">
          <legend class="label">蒸らしのあとの注湯の回数</legend>
          <div class="chips two" id="pourCountChips"></div>
        </fieldset>
      </div>

      <div class="card">
        <h2>分量と湯温</h2>
        <div class="field" id="doseField"></div>
        <div class="field" id="ratioField"></div>
        <div class="field" id="waterField"></div>
        <div class="field" id="tempField"></div>
      </div>

      <div class="card">
        <h2>挽き目と器具</h2>
        <label class="field">
          <span class="label">グラインダー</span>
          <select id="grinderId"></select>
        </label>
        <div class="field" id="grindField"></div>
        <label class="field">
          <span class="label">ドリッパー</span>
          <select id="dripperId"></select>
        </label>
        <label class="field">
          <span class="label">フィルター</span>
          <select id="filterId"></select>
        </label>
        <label class="field">
          <span class="label">ケトル</span>
          <select id="kettleId"></select>
        </label>
        <p class="hint"><a href="equipment.html">器具を登録する</a>（入力中の内容は保存されないので、先に保存してください）</p>
      </div>

      <div class="card">
        <h2>注湯</h2>
        <p class="hint">「時間」はお湯を注ぎ始める時刻、「累計」はスケールの表示で何gまで注ぐかです。1投目が蒸らしです。「注ぐ秒数」はその投を注ぎ終えるまでの目安で、タイマーの「注ぐ」と「待つ」の切り替えに使います。</p>
        <div class="field" id="flowField"></div>
        <div id="pours"></div>
        <span class="field-error" data-for="pours"></span>
        <div class="row">
          <button class="btn secondary" type="button" id="addPour">＋ 注湯を足す</button>
          <button class="btn secondary" type="button" id="fitPours" hidden>湯量に合わせる</button>
        </div>
        <label class="check-row">
          <input type="checkbox" id="bloomStir">
          <span>蒸らしで攪拌する</span>
        </label>
        <label class="field">
          <span class="label">目標の抽出時間（落ち切りまで）</span>
          <input type="text" inputmode="numeric" id="targetTotalSec" autocomplete="off" placeholder="3:30">
          <span class="field-error" data-for="targetTotalSec"></span>
        </label>
      </div>

      <div class="card">
        <label class="check-row">
          <input type="checkbox" id="favorite">
          <span>お気に入り（一覧の上に出す）</span>
        </label>
        <label class="field">
          <span class="label">メモ</span>
          <textarea id="memo" rows="2"></textarea>
        </label>
      </div>

      <div class="row" id="deleteRow" hidden>
        <button class="btn danger" type="button" id="delete">このレシピを削除</button>
      </div>

      <p id="msg" role="status"></p>

      <div class="bottom-bar">
        <button class="btn block" type="submit" id="save">保存する</button>
      </div>
    </form>
  </main>
  <script type="module" src="js/recipe-edit-page.js"></script>
</body>
</html>
